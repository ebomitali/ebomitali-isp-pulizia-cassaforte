// the build process is the following:
// 1. generate the single fat source file using helper/sh/create-source-blob.sh
// 2. copy tests from library/src/test/groovy to fat-source/src/test/groovy
// 3. compile and test the fat source with Gradle (see library/build.gradle for test dependencies)

plugins {
    id 'groovy'
}

// Task 1: Use fat-source's generated FullPuliziaCassaforte.groovy
task generateFullFatSource {
    description = 'Ensure fat-source FullPuliziaCassaforte.groovy is generated'
    dependsOn project(':fat-source').tasks.named('compileGroovy')
}

// Task 2: Copy tests and resources from library to fat-source
task copyTests(type: Copy) {
    description = 'Copy tests and resources from library/src/test to fat-source/src/test'
    from project(':library').fileTree('src/test') {
        include '**/*.*'
        exclude 'sh/**' // exclude shell scripts — full-fat-source has its own test scripts
    }
    into 'src/test'
}

// Task 3: Configure compilation and testing
sourceSets {
    main {
        groovy {
            srcDirs = ['src/main/groovy']
        }
    }
    test {
        groovy {
            srcDirs = ['src/test/groovy']
        }
        resources {
            srcDirs = ['src/test/resources']
        }
    }
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

configurations {
    shRuntime  // slf4j provider jar(s) for mrunpct2.sh standalone execution
}

dependencies {
    compileOnly project(':stubs')
    implementation project(':fat-source')
    implementation 'org.apache.groovy:groovy-all:4.0.25'
    implementation 'org.slf4j:slf4j-api:2.0.16'
    testImplementation platform('org.spockframework:spock-bom:2.3-groovy-4.0')
    testImplementation 'org.spockframework:spock-core'
    testImplementation 'net.bytebuddy:byte-buddy:1.14.18'
    testImplementation 'org.junit.jupiter:junit-jupiter:5.11.4'
    testImplementation project(':stubs')
    testImplementation project(':fat-source')
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher:1.10.2'
    testRuntimeOnly 'ch.qos.logback:logback-classic:1.5.15'
    shRuntime 'org.slf4j:slf4j-simple:2.0.16'
}

// Copy slf4j-simple for use by mrunpct2.sh (groovy -cp build/sh-lib/*)
task copyShLibs(type: Copy) {
    description = 'Copy slf4j-simple provider for standalone shell script execution'
    from configurations.shRuntime
    into layout.buildDirectory.dir('sh-lib')
}

// Ensure tests are copied before compilation
//compileMainGroovy.dependsOn generateFatSource
compileTestGroovy.dependsOn copyTests, compileGroovy
processTestResources.dependsOn copyTests
compileGroovy.dependsOn generateFullFatSource,copyTests

// build.gradle
tasks.register('testPuliziaCassaforte', Exec) {
    group = 'verification'
    description = 'Runs the custom shell-based test script with project context'

    // Let the task depend on whatever needs to exist first
    dependsOn tasks.named('testClasses'), tasks.named('copyShLibs')

    doFirst {
        def testClasspath = sourceSets.test.runtimeClasspath.asPath
        def projectDir = project.projectDir.absolutePath
        def buildDir = project.layout.buildDirectory.get().asFile.absolutePath
        def testResultsDir = "${buildDir}/test-results"

        def fatSourceFile = project(':fat-source').file('src/main/groovy/FullPuliziaCassaforte.groovy').absolutePath
        def frontEndScript = project(':front-end').file('src/main/groovy/RunPuliziaCassaforte.groovy').absolutePath
        def stubsJar = project(':stubs').layout.buildDirectory.file('libs/stubs.jar').get().asFile.absolutePath
        def shLibDir = layout.buildDirectory.dir('sh-lib').get().asFile.absolutePath
        def scriptDir = "${projectDir}/src/test/sh/mac"

        def groovyClasspath = "${stubsJar}:${shLibDir}/*:${scriptDir}"

        environment 'PROJECT_DIR', projectDir
        environment 'BUILD_DIR', buildDir
        environment 'TEST_CLASSPATH', testClasspath
        environment 'TEST_RESULTS_DIR', testResultsDir
        environment 'GROOVY_CLASSPATH', groovyClasspath

        commandLine 'bash', "${scriptDir}/mrunpct2.sh", fatSourceFile, frontEndScript

        // Forward any -P args the user passes on the CLI
        if (project.hasProperty('testArgs')) {
            args = project.testArgs.split(' ')
        }
    }
}

tasks.register('testPuliziaPostBuild') {
    group = 'verification'
    description = 'PuliziaPostBuild is a DBB TaskScript (tested via library:test). Skipped here as standalone test.'

    // PuliziaPostBuild.groovy is a DBB TaskScript with @BaseScript annotation.
    // It requires DBB runtime and cannot run as a standalone script in this test harness.
    // Functional testing happens in :library:test via PuliziaPostBuildLogic tests.
    // Standalone USS testing happens on USS with groovyz and DBB context.
    doFirst {
        def testClasspath = sourceSets.test.runtimeClasspath.asPath
        def projectDir = project.projectDir.absolutePath
        def buildDir = project.layout.buildDirectory.get().asFile.absolutePath
        def testResultsDir = "${buildDir}/test-results"

        def fatSourceFile = project(':fat-source').file('src/main/groovy/FullPuliziaCassaforte.groovy').absolutePath
        def frontEndScript = project(':front-end').file('src/main/groovy/RunPuliziaCassaforte.groovy').absolutePath
        def stubsJar = project(':stubs').layout.buildDirectory.file('libs/stubs.jar').get().asFile.absolutePath
        def shLibDir = layout.buildDirectory.dir('sh-lib').get().asFile.absolutePath
        def scriptDir = "${projectDir}/src/test/sh/mac"

        def groovyClasspath = "${stubsJar}:${shLibDir}/*:${scriptDir}"

        environment 'PROJECT_DIR', projectDir
        environment 'BUILD_DIR', buildDir
        environment 'TEST_CLASSPATH', testClasspath
        environment 'TEST_RESULTS_DIR', testResultsDir
        environment 'GROOVY_CLASSPATH', groovyClasspath

        commandLine 'bash', "${scriptDir}/mrunppb.sh", fatSourceFile, frontEndScript

        // Forward any -P args the user passes on the CLI
        if (project.hasProperty('testArgs')) {
            args = project.testArgs.split(' ')
        }
    }

    doLast {
        println "✓ PuliziaPostBuild tested via :library:test (doPuliziaPostBuild)"
    }
}

test {
    useJUnitPlatform()
    outputs.upToDateWhen { false }
    dependsOn tasks.named('testPuliziaCassaforte')
    dependsOn tasks.named('testPuliziaPostBuild')
}
