plugins {
    id 'groovy'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

sourceSets {
    main {
        groovy {
            srcDirs = ['src/main/groovy']
        }
        java {
            srcDirs = ['src/main/java']
        }
        resources {
            srcDirs = ['src/main/resources']
        }
    }
    test {
        groovy {
            srcDirs = ['src/test/groovy']
        }
        java {
            srcDirs = ['src/test/java']
        }
        resources {
            srcDirs = ['src/test/resources']
        }
    }
}

dependencies {
    compileOnly project(':stubs')
    implementation 'org.apache.groovy:groovy-all:4.0.25'
    implementation 'org.slf4j:slf4j-api:2.0.16'

    testImplementation project(':stubs')
    testImplementation 'org.spockframework:spock-core:2.3-groovy-4.0'
    testImplementation 'org.junit.jupiter:junit-jupiter:5.11.4'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher:1.10.2'
    testRuntimeOnly 'ch.qos.logback:logback-classic:1.5.16'
    testRuntimeOnly 'org.slf4j:slf4j-simple:2.0.13'
}

test {
    useJUnitPlatform()
}

// Integration tests
sourceSets {
    integrationTest {
        groovy {
            srcDirs = ['src/integrationTest/groovy']
        }
        resources {
            srcDirs = ['src/integrationTest/resources']
        }
        compileClasspath += sourceSets.main.output + configurations.testCompileClasspath
        runtimeClasspath += output + compileClasspath + configurations.testRuntimeClasspath
    }
}

configurations {
    integrationTestImplementation.extendsFrom testImplementation
    integrationTestRuntimeOnly.extendsFrom testRuntimeOnly
}

task generateFullFatSource {
    description = 'Generate the single fat source file from sources'
    doLast {
        def tempDir = file("${buildDir}/temp-sources")
        tempDir.mkdirs()
        def fatDir = file("${buildDir}/fat-source")
        fatDir.mkdirs()

        copy {
            from fileTree('src/main/groovy')
            into "${tempDir}"
            include '**/*.groovy'
            exclude '**/fe/RunPuliziaTemporanei.groovy'
        }
        
        exec {
            commandLine 'sh', "${rootProject.projectDir}/helper/sh/create-source-blob.sh", "${tempDir}", "${buildDir}/fat-source/FullPuliziaTemporanei.groovy"
        }
    }
}

tasks.register('integrationTest', Test) {
    description = 'Run integration tests'
    group = 'verification'
    testClassesDirs = sourceSets.integrationTest.output.classesDirs
    classpath = sourceSets.integrationTest.runtimeClasspath
    useJUnitPlatform()
    dependsOn jar, generateFullFatSource

    doFirst {
        def jarPath = jar.archiveFile.get().asFile.absolutePath
        // Include all testRuntimeClasspath jars plus working directory for logback.xml
        def allJars = configurations.testRuntimeClasspath.files.collect { it.absolutePath }
        def groovyClasspath = ([jarPath] + allJars + ['.']).join(':')

        // Collect SLF4J jars for deployment to workDir/lib
        def slf4jApiJar = configurations.testRuntimeClasspath.files.find { it.name.startsWith('slf4j-api') }
        def slf4jSimpleJar = configurations.testRuntimeClasspath.files.find { it.name.startsWith('slf4j-simple') }

        systemProperty 'puliziaCassaforteJar', jarPath
        systemProperty 'groovyClasspath', groovyClasspath
        systemProperty 'fatSourceFile', "${buildDir}/fat-source/FullPuliziaTemporanei.groovy"
        systemProperty 'feEntryPointFile', 'src/main/groovy/com/intesasanpaolo/bes/fe/RunPuliziaTemporanei.groovy'
        systemProperty 'slf4jApiJar', slf4jApiJar?.absolutePath ?: ''
        systemProperty 'slf4jSimpleJar', slf4jSimpleJar?.absolutePath ?: ''
    }

    testLogging {
        events "passed", "skipped", "failed", "standard_out", "standard_error"
        exceptionFormat "full"
        showStandardStreams true
    }
}

check.dependsOn integrationTest
