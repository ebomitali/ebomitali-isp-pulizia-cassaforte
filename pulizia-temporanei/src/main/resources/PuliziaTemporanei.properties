# PuliziaTemporanei Configuration
# ==============================

# Type of file operations: 'zos' (production), 'uss' (USS simulation), or 'macos' (local testing)
# Default: zos
fileOpsType=zos

# Base directory for filesystem simulations (uss, macos modes only)
# Required when fileOpsType is 'uss' or 'macos'
# Examples: /tmp/zos-sim, /var/tmp/datasets
# uxBasedir=/tmp/zos-sim
